<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"></head>
<body style="font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; margin: 0; padding: 40px 20px;">
  <table align="center" border="0" cellpadding="0" cellspacing="0" width="100%" style="max-width: 600px; background-color: #ffffff; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.1);">
    <tr>
      <td align="center" style="background-color: {{ t.bg }}; padding: 30px 20px;">
        {% if has_logo %}<img src="cid:logo" alt="Logo" style="max-height: 80px; margin-bottom: 15px; display: block; border-radius: 4px;">{% endif %}
        <h1 style="color: #ffffff; margin: 0; font-size: 24px; text-transform: uppercase; letter-spacing: 1px;">{{ a.header }}</h1>
      </td>
    </tr>
    <tr>
      <td style="padding: 40px 30px;">
        <p style="font-size: 18px; color: #333333; margin-top: 0;">Olá,</p>
        <p style="font-size: 16px; color: #555555; line-height: 1.5;">{{ intro_html|safe }}</p>
        <div style="background-color: {{ t.box_bg }}; border-left: 5px solid {{ t.box_border }}; padding: 15px 20px; margin: 25px 0; border-radius: 0 4px 4px 0;">
          <h2 style="margin: 0 0 5px 0; color: {{ t.title }}; font-size: 28px;">{{ a.box_title }}</h2>
          <span style="color: #555555; font-size: 14px;">{{ a.box_sub }}</span>
        </div>
        <table border="0" cellpadding="12" cellspacing="0" width="100%" style="background-color: #f9f9f9; border: 1px solid #eeeeee; border-radius: 6px;">
          {% for label, value in a.rows %}
          <tr>
            <td width="40%" style="color: #666666; font-weight: bold;{% if not loop.last %} border-bottom: 1px solid #eeeeee;{% endif %}">{{ label }}:</td>
            <td width="60%" style="color: #333333;{% if not loop.last %} border-bottom: 1px solid #eeeeee;{% endif %}">{{ value }}</td>
          </tr>
          {% endfor %}
        </table>
        {% if a.footer %}<p style="font-size: 14px; color: #555555; line-height: 1.5; margin-top: 25px;">{{ a.footer }}</p>{% endif %}
      </td>
    </tr>
    <tr>
      <td align="center" style="background-color: #f8f9fa; padding: 20px; border-top: 1px solid #eeeeee;">
        <p style="margin: 0; font-size: 12px; color: #aaaaaa;">Mensagem automática gerada pelo sistema <strong>Whois Notification</strong>.</p>
      </td>
    </tr>
  </table>
</body>
</html>
