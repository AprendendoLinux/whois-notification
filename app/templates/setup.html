{% extends "auth_base.html" %}
{% block title %}Configuração inicial{% endblock %}
{% block content %}
<form class="form" method="post" action="/setup">
  <input type="hidden" name="csrf" value="{{ csrf_token(request) }}">
  <div>
    <h2>Configuração inicial</h2>
    <p class="muted" style="margin:6px 0 0">Crie a conta de administrador. Esta tela só aparece enquanto não houver nenhum usuário.</p>
  </div>
  {% if error %}<div class="flash"><div class="err" role="alert">{{ error }}</div></div>{% endif %}
  <div class="field"><label for="u">Usuário</label><input id="u" type="text" name="username" value="{{ username or 'admin' }}" autocomplete="username" required></div>
  <div class="field"><label for="p">Senha</label><input id="p" type="password" name="password" minlength="8" autocomplete="new-password" required><span class="help">Mínimo de 8 caracteres.</span></div>
  <div class="field"><label for="p2">Confirme a senha</label><input id="p2" type="password" name="password2" minlength="8" autocomplete="new-password" required></div>
  <button class="btn primary" type="submit">Criar administrador</button>
</form>
{% endblock %}
