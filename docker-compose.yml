services:
  whois_notification:
    image: ghcr.io/aprendendolinux/whois-notification:latest
    container_name: whois_notification
    ports:
      - "8000:8000"
    volumes:
      # Chaves geradas no primeiro boot (sessão e criptografia das senhas SMTP/tokens).
      # Não perca esta pasta: sem ela, os segredos salvos no banco não podem ser lidos.
      - /srv/whois/app:/app/data
    environment:
      # Única configuração por variáveis de ambiente: conexão com o banco.
      # Todo o resto (usuários, SMTP, Telegram, fuso, agendamento) é feito pela interface.
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=whois
      - DB_USER=whois
      - DB_PASSWORD=troque_esta_senha
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  db:
    image: mysql:latest
    container_name: whois_db
    environment:
      - MYSQL_DATABASE=whois
      - MYSQL_USER=whois
      - MYSQL_PASSWORD=troque_esta_senha
      - MYSQL_ROOT_PASSWORD=troque_a_senha_root
    volumes:
      - /srv/whois/mysql:/var/lib/mysql
    restart: unless-stopped
